<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BetAnything Lotto Fireball Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D12;
    --panel:#1A1E26;
    --panel-2:#20242E;
    --purple:#5B2EFF;
    --purple-dark:#3A1C8F;
    --gold:#D4A017;
    --text:#FFFFFF;
    --text-2:#B8BEC9;
    --green:#32D74B;
    --red:#E53935;
    --border:#2C3140;
    --glow-1:rgba(91,46,255,0.12);
    --glow-2:rgba(58,28,143,0.18);
  }
  html[data-theme="light"]{
    --bg:#F3F2F8;
    --panel:#FFFFFF;
    --panel-2:#F5F4FA;
    --purple:#5B2EFF;
    --purple-dark:#7458E0;
    --gold:#B8860B;
    --text:#181A22;
    --text-2:#5B6070;
    --green:#1E8E3E;
    --red:#C62828;
    --border:#E2E1EC;
    --glow-1:rgba(91,46,255,0.06);
    --glow-2:rgba(91,46,255,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, var(--glow-1), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--glow-2), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    transition:background-color .25s ease, color .25s ease;
  }
  .mono{font-family:'JetBrains Mono', monospace;}

  /* ===== Header ===== */
  .app-header{
    background:linear-gradient(120deg, var(--purple-dark) 0%, var(--purple) 100%);
    padding:22px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,0.08);
    box-shadow:0 4px 24px rgba(91,46,255,0.25);
  }
  .app-header .brand{display:flex; align-items:center; gap:14px;}
  .app-header .mark{
    width:38px;height:38px;border-radius:10px;
    background:rgba(0,0,0,0.25);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:16px; color:var(--gold);
    border:1px solid rgba(212,160,23,0.4);
  }
  .app-header h1{
    font-size:18px; font-weight:700; margin:0; letter-spacing:0.2px;
  }
  .app-header .header-right{ display:flex; align-items:center; gap:14px; }

  .theme-toggle{
    width:38px; height:38px; border-radius:10px;
    background:rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
  }
  .theme-toggle:hover{ background:rgba(0,0,0,0.4); border-color:rgba(255,255,255,0.35); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:flex; }

  /* ===== Tabs ===== */
  .tabs-nav{
    max-width:1100px; margin:0 auto; padding:0 20px;
    display:flex; gap:4px;
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    background:transparent; border:none;
    color:var(--text-2); font-weight:700; font-size:13.5px;
    padding:16px 18px 14px;
    border-bottom:2px solid transparent;
    transition:all .2s ease;
    margin-bottom:-1px;
  }
  .tab-btn:hover{ color:var(--text); }
  .tab-btn.active{ color:var(--purple); border-bottom-color:var(--purple); }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  main{max-width:1100px; margin:0 auto; padding:28px 20px 80px;}

  /* ===== Ticket Card ===== */
  .ticket{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    position:relative;
    transition:box-shadow .25s ease, border-color .25s ease;
  }
  .ticket:hover{border-color:#3a3f52;}
  .ticket-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .ticket-head .label{
    font-size:13px; font-weight:700; color:var(--text-2);
    text-transform:uppercase; letter-spacing:0.6px;
    display:flex; align-items:center; gap:8px;
  }
  .ticket-head .label .num{
    background:var(--purple);
    color:#fff; font-size:11px; font-weight:800;
    width:22px;height:22px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .remove-btn{
    background:transparent; border:1px solid var(--border);
    color:var(--text-2); width:32px; height:32px; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
  }
  .remove-btn:hover{ border-color:var(--red); color:var(--red); background:rgba(229,57,53,0.08); }
  .remove-btn svg{width:15px;height:15px;}

  .field-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:14px;
  }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-size:11px; font-weight:600; color:var(--text-2);
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .field .hint{ font-size:10.5px; color:#7C8394; font-weight:500; margin-top:2px; }
  .field .error-msg{ font-size:10.5px; color:var(--red); font-weight:600; margin-top:2px; display:none; }
  .field.has-error .error-msg{ display:block; }
  .field.has-error input, .field.has-error select{ border-color:var(--red) !important; box-shadow:0 0 0 3px rgba(229,57,53,0.15) !important; }

  .col-2{grid-column:span 2;}
  .col-1{grid-column:span 1;}

  /* Custom select */
  .select-wrap{ position:relative; }
  select{
    appearance:none; -webkit-appearance:none;
    width:100%;
    background:var(--panel-2);
    border:1.5px solid var(--purple-dark);
    color:var(--text);
    font-family:inherit; font-size:14px; font-weight:600;
    padding:11px 34px 11px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  select:hover{ border-color:var(--purple); }
  select:focus{
    outline:none; border-color:var(--purple);
    box-shadow:0 0 0 3px rgba(91,46,255,0.25), 0 0 16px rgba(91,46,255,0.25);
  }
  .select-wrap::after{
    content:'';
    position:absolute; right:13px; top:50%;
    width:8px; height:8px;
    border-right:2px solid var(--text-2);
    border-bottom:2px solid var(--text-2);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  input[type="text"], input[type="number"]{
    width:100%;
    background:var(--panel-2);
    border:1.5px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:600;
    letter-spacing:1.5px;
    padding:10px 12px;
    border-radius:10px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input[type="number"]{ letter-spacing:0.3px; font-family:'Inter', sans-serif; }
  input::placeholder{ color:#565D6D; letter-spacing:0.5px; }
  input:focus{
    outline:none; border-color:var(--purple);
    box-shadow:0 0 0 3px rgba(91,46,255,0.22), 0 0 16px rgba(91,46,255,0.2);
  }
  input:hover{ border-color:#454b5f; }

  .fireball-input{ border-color:var(--purple-dark) !important; }
  .fireball-input:focus{ box-shadow:0 0 0 3px rgba(91,46,255,0.25), 0 0 18px rgba(91,46,255,0.3) !important; }

  /* ===== Toolbar ===== */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin:22px 0 8px;
    flex-wrap:wrap;
  }
  .toolbar-left{ display:flex; gap:12px; flex-wrap:wrap; }
  .toolbar-right{ display:flex; gap:12px; flex-wrap:wrap; }

  button{ font-family:inherit; cursor:pointer; border:none; }

  .btn-add{
    background:transparent;
    color:var(--purple);
    border:1.5px dashed var(--purple-dark);
    padding:12px 18px;
    border-radius:10px;
    font-weight:700; font-size:13.5px;
    display:flex; align-items:center; gap:8px;
    transition:all .2s ease;
  }
  .btn-add:hover{ background:rgba(91,46,255,0.08); border-color:var(--purple); box-shadow:0 0 14px rgba(91,46,255,0.18); }
  .btn-add svg{width:16px;height:16px;}

  .btn-clear{
    background:transparent;
    color:var(--text-2);
    border:1.5px solid var(--border);
    padding:12px 18px;
    border-radius:10px;
    font-weight:700; font-size:13.5px;
    transition:all .2s ease;
  }
  .btn-clear:hover{ border-color:var(--red); color:var(--red); background:rgba(229,57,53,0.06); }
  .btn-clear.confirming{ border-color:var(--red); color:#fff; background:var(--red); }

  .btn-calc{
    background:linear-gradient(135deg, var(--gold), #B8860B);
    color:#1a1400;
    padding:14px 30px;
    border-radius:11px;
    font-weight:800; font-size:14.5px;
    letter-spacing:0.3px;
    box-shadow:0 4px 18px rgba(212,160,23,0.28);
    transition:all .2s ease;
  }
  .btn-calc:hover{ box-shadow:0 4px 26px rgba(212,160,23,0.5); transform:translateY(-1px); }
  .btn-calc:active{ transform:translateY(0); }

  /* ===== Results ===== */
  .results{
    margin-top:20px; padding-top:20px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .results.show{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .result-banner{
    text-align:center;
    padding:10px 16px;
    border-radius:10px;
    font-weight:800; font-size:14px; letter-spacing:0.4px;
    margin-bottom:16px;
    text-transform:uppercase;
  }
  .result-banner.win-both{ background:rgba(50,215,75,0.12); border:1.5px solid var(--green); color:var(--green); box-shadow:0 0 20px rgba(50,215,75,0.15) inset; }
  .result-banner.win-base{ background:rgba(50,215,75,0.1); border:1.5px solid var(--green); color:var(--green); }
  .result-banner.win-fireball{ background:rgba(91,46,255,0.12); border:1.5px solid var(--purple); color:#B29CFF; }
  .result-banner.lose{ background:rgba(229,57,53,0.08); border:1.5px solid var(--red); color:var(--red); }

  .cards-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .rcard{
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:12px; padding:16px 18px;
  }
  .rcard.fireball-card{ border-color:var(--purple-dark); }
  .rcard h4{
    margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--text-2); display:flex; align-items:center; justify-content:space-between;
  }
  .fireball-card h4{ color:#B29CFF; }
  .rline{ display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:13px; }
  .rline .k{ color:var(--text-2); }
  .rline .v{ font-weight:700; }
  .v.win{ color:var(--green); }
  .v.lose{ color:var(--red); }
  .v.gold{ color:var(--gold); }
  .v.mono{ font-family:'JetBrains Mono', monospace; letter-spacing:1px; }

  .fb-table{ width:100%; border-collapse:collapse; margin:10px 0; font-size:12.5px; }
  .fb-table th{ text-align:left; color:var(--text-2); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--border); text-transform:uppercase; font-size:10.5px; letter-spacing:0.4px;}
  .fb-table td{ padding:6px 4px; border-bottom:1px solid rgba(255,255,255,0.04); font-family:'JetBrains Mono', monospace; letter-spacing:1px; }
  .fb-table tr.matched td{ color:var(--purple); font-weight:700; }
  .fb-table td.pos{ color:var(--text-2); font-family:'Inter',sans-serif; letter-spacing:0; }

  .total-strip{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
    margin-top:14px;
    background:linear-gradient(135deg, rgba(58,28,143,0.35), rgba(91,46,255,0.12));
    border:1px solid var(--purple-dark);
    border-radius:12px; padding:16px 18px;
  }
  .total-strip .tstat{ text-align:center; }
  .total-strip .tstat .tk{ font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .total-strip .tstat .tv{ font-size:19px; font-weight:800; color:var(--gold); }
  .total-strip .tstat .tv.zero{ color:var(--text-2); }

  /* Customer response */
  .response-card{
    margin-top:16px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:12px; padding:16px 18px;
  }
  .response-card h4{
    margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-2);
    display:flex; justify-content:space-between; align-items:center;
  }
  .response-text{
    font-size:13.5px; line-height:1.6; color:#E4E7EC;
  }
  .btn-copy{
    background:transparent; border:1.5px solid var(--border); color:var(--text-2);
    padding:7px 14px; border-radius:8px; font-size:12px; font-weight:700;
    display:flex; align-items:center; gap:6px; transition:all .2s ease;
  }
  .btn-copy:hover{ border-color:var(--purple); color:#fff; background:rgba(91,46,255,0.1); }
  .btn-copy.copied{ border-color:var(--green); color:var(--green); }
  .btn-copy svg{width:13px;height:13px;}

  /* ===== Summary ===== */
  .summary{
    background:var(--panel);
    border:1px solid var(--purple-dark);
    border-radius:14px;
    padding:22px 24px;
    margin-top:8px;
    box-shadow:0 0 30px rgba(91,46,255,0.08);
    display:none;
  }
  .summary.show{ display:block; }
  .summary h3{
    margin:0 0 16px; font-size:14px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-2);
    display:flex; align-items:center; gap:8px;
  }
  .summary h3::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }
  .summary-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sstat{ background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; }
  .sstat .sk{ font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  .sstat .sv{ font-size:20px; font-weight:800; }
  .sstat .sv.gold{ color:var(--gold); }
  .sstat.highlight{ border-color:var(--gold); box-shadow:0 0 16px rgba(212,160,23,0.15); }

  /* ===== Paylines ===== */
  .paylines-group{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:22px; margin-bottom:20px;
  }
  .paylines-group h3{
    margin:0 0 4px; font-size:15px; font-weight:800; color:var(--text);
    display:flex; align-items:center; gap:10px;
  }
  .paylines-group h3 .pick-tag{
    background:var(--purple); color:#fff; font-size:11px; font-weight:800;
    padding:3px 10px; border-radius:20px;
  }
  .paylines-group .group-note{ font-size:12px; color:var(--text-2); margin:4px 0 16px; }
  table.paylines-table{ width:100%; border-collapse:collapse; }
  table.paylines-table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-2); font-weight:700; padding:9px 10px; border-bottom:1px solid var(--border);
  }
  table.paylines-table td{
    padding:11px 10px; font-size:13.5px; border-bottom:1px solid var(--border);
    color:var(--text);
  }
  table.paylines-table tr:last-child td{ border-bottom:none; }
  table.paylines-table td.pl-type{ font-weight:700; }
  table.paylines-table td.pl-example{ font-family:'JetBrains Mono', monospace; letter-spacing:1px; color:var(--text-2); }
  table.paylines-table td.pl-odds{ font-weight:800; color:var(--gold); white-space:nowrap; }
  table.paylines-table tr.pl-straight td.pl-type{ color:var(--purple); }

  @media (max-width: 860px){
    .field-grid{ grid-template-columns:repeat(2,1fr); }
    .col-2, .col-1{ grid-column:span 2; }
    .cards-row{ grid-template-columns:1fr; }
    .total-strip{ grid-template-columns:1fr 1fr; }
    .summary-grid{ grid-template-columns:1fr 1fr; }
    .app-header{ padding:18px 18px; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="brand">
    <div class="mark">BA</div>
    <div>
      <h1>BetAnything Lotto Fireball Calculator</h1>
    </div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" title="Toggle light / dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</div>

<nav class="tabs-nav">
  <button class="tab-btn active" data-tab="calculator">Calculator</button>
  <button class="tab-btn" data-tab="paylines">Paylines</button>
</nav>

<main>
  <div class="tab-panel active" data-panel="calculator">
    <div id="tickets-container"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn-add" id="addTicketBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Ticket
        </button>
        <button class="btn-clear" id="clearAllBtn">Clear All</button>
      </div>
      <div class="toolbar-right">
        <button class="btn-calc" id="calcBtn">Calculate Result</button>
      </div>
    </div>

    <div class="summary" id="summary">
      <h3>Overall Summary</h3>
      <div class="summary-grid">
        <div class="sstat"><div class="sk">Total Wagered</div><div class="sv" id="sumTotalWager">$0.00</div></div>
        <div class="sstat"><div class="sk">Total Base Wager</div><div class="sv" id="sumBaseWager">$0.00</div></div>
        <div class="sstat"><div class="sk">Total Fireball Wager</div><div class="sv" id="sumFbWager">$0.00</div></div>
        <div class="sstat"><div class="sk">Total Base Winnings</div><div class="sv" id="sumBaseWin">$0.00</div></div>
        <div class="sstat"><div class="sk">Total Fireball Winnings</div><div class="sv" id="sumFbWin">$0.00</div></div>
        <div class="sstat highlight"><div class="sk">Total Winnings</div><div class="sv gold" id="sumTotalWin">$0.00</div></div>
        <div class="sstat highlight"><div class="sk">Total Return</div><div class="sv gold" id="sumTotalReturn">$0.00</div></div>
        <div class="sstat"><div class="sk">Tickets Checked</div><div class="sv" id="sumCount">0</div></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" data-panel="paylines">
    <div id="paylines-container"></div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
